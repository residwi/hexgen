all: true
force-file-write: true
formatter: goimports
log-level: info
template: testify

dir: "{{.InterfaceDir}}"
pkgname: "{{.SrcPackageName}}"
filename: "mocks_test.go"

packages:
  __MODULE__/internal:
    config:
      recursive: true
  __MODULE__/internal/platform/cache:
    config:
      all: false
  __MODULE__/internal/platform/database:
    config:
      all: false
  __MODULE__/internal/platform/storage:
    config:
      all: false
  __MODULE__/internal/platform/web/request:
    config:
      all: false
